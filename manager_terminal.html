:root{
  --bg:#f0f4f8;--bg2:#fff;--border:#e2e8f0;
  --text:#1a202c;--text2:#4a5568;--text3:#a0aec0;
  --accent:#3182ce;--accent-bg:#ebf8ff;
  --green:#276749;--green-bg:#f0fff4;--green-bd:#9ae6b4;
  --orange:#c05621;--orange-bg:#fffaf0;--orange-bd:#fbd38d;
  --red:#c53030;--red-bg:#fff5f5;--red-bd:#fed7d7;
  --yellow:#b7791f;--yellow-bg:#fffff0;--yellow-bd:#fefcbf;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text)}

body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.login{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100}
.login.hidden{display:none}
.lcard{background:#fff;border-radius:16px;padding:32px 28px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.lcard img{height:56px;object-fit:contain;margin-bottom:12px}
.lcard h2{font-size:17px;font-weight:700;margin-bottom:16px}
.lcard select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:14px;font-family:var(--font);background:#fff;outline:none}
.pins{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.pin{width:48px;height:52px;border:2px solid var(--border);border-radius:10px;font-size:22px;text-align:center;font-family:var(--font);background:#fff;outline:none}
.pin:focus{border-color:var(--accent)}
.lbtn{width:100%;padding:12px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font)}
.lerr{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}

.topbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar img{height:32px;object-fit:contain}
.topbar-title{font-size:15px;font-weight:700;flex:1}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lb{padding:4px 9px;border-radius:6px;font-size:11px;font-weight:700;border:1.5px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-family:var(--font)}
.lb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.topbar-user{font-size:13px;color:var(--text2)}
.logout-btn{padding:5px 9px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:13px;font-family:var(--font)}

.notif{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a202c;color:#fff;border-radius:8px;padding:10px 20px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.notif.show{opacity:1}

.app{flex:1;display:flex;overflow:hidden}
/* Sidebar */
.sidebar{width:190px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);overflow-y:auto;padding:8px 0}
@media(max-width:600px){
  .sidebar{position:fixed;left:-190px;top:0;bottom:0;z-index:60;transition:left .25s;box-shadow:2px 0 20px rgba(0,0,0,.15)}
  .sidebar.open{left:0}
  .menu-toggle{display:flex!important}
  .panel-wrap{padding:12px 8px}
}
.nav-sec{padding:5px 12px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-top:6px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:13px;color:var(--text2)}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
/* Panel */
.panel-wrap{flex:1;overflow-y:auto;padding:16px 20px}
.panel{display:none}
.panel.on{display:block}
.page-title{font-size:17px;font-weight:700;margin-bottom:16px}
/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border-radius:10px;border:1px solid var(--border);padding:14px}
.card-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.card-val{font-size:22px;font-weight:800}
.card-sub{font-size:11px;color:var(--text3);margin-top:3px}
/* Table wrap */
.twrap{background:#fff;border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px}
.twrap-head{padding:10px 14px;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);background:var(--bg);display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:7px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;border-bottom:1.5px solid var(--border);background:var(--bg)}
td{padding:9px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.badge{display:inline-flex;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700}
.badge.new,.badge.baru{background:var(--red-bg);color:var(--red)}
.badge.cooking,.badge.making{background:var(--orange-bg);color:var(--orange)}
.badge.ready{background:var(--green-bg);color:var(--green)}
/* Date row */
.date-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.date-row input{padding:6px 9px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:var(--font);outline:none}
.date-row button{padding:6px 12px;border-radius:7px;background:var(--accent);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)}
.date-row .ghost{background:var(--bg);color:var(--text2);border:1.5px solid var(--border)}
.ghost.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.storno-btn{padding:3px 8px;border-radius:5px;border:1.5px solid var(--red);background:var(--red-bg);color:var(--red);font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font)}
/* Form */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase}
.fg input,.fg select{padding:7px 9px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font);outline:none}
.fbtn2{padding:7px 14px;border-radius:7px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)}
.del-btn{padding:3px 8px;border-radius:5px;border:1.5px solid var(--red);background:var(--red-bg);color:var(--red);font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font)}
.avail-tog{width:34px;height:18px;border-radius:9px;background:var(--border);border:none;cursor:pointer;position:relative;transition:background .18s;flex-shrink:0}
.avail-tog.on{background:var(--green)}
.avail-tog::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .18px}
.avail-tog.on::after{transform:translateX(16px)}
.menu-toggle{display:none;padding:5px 8px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:15px;margin-right:4px}

function buildSelect(){
  var sel=document.getElementById('login-role');
  if(!sel)return;
  sel.innerHTML='<option value="">— '+t('selectStaff')+' —</option>';
  staff.filter(function(s){return s.active;}).forEach(function(s){
    var o=document.createElement('option');o.value=s.id;
    o.textContent=s.fname+' '+(s.lname||'');sel.appendChild(o);
  });
}

function initPins(){
  var pins=document.querySelectorAll('.pin');
  pins.forEach(function(el,i){
    el.setAttribute('readonly','');
    el.addEventListener('focus',function(){this.removeAttribute('readonly');this.value='';});
    el.addEventListener('input',function(){
      if(this.value&&i<pins.length-1) pins[i+1].focus();
      else if(i===pins.length-1&&Array.from(pins).every(function(p){return p.value;})) doLogin();
    });
    el.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!this.value&&i>0)pins[i-1].focus();});
  });
}

function clearPins(){document.querySelectorAll('.pin').forEach(function(el){el.value='';el.setAttribute('readonly','');});}

function doLogin(){
  var sid=document.getElementById('login-role').value;
  var pin=Array.from(document.querySelectorAll('.pin')).map(function(p){return p.value;}).join('');
  var m=staff.find(function(s){return String(s.id)===String(sid);});
  if(!m){document.getElementById('login-err').textContent=t('selectStaff');return;}
  if(m.pin===null||m.pin===undefined||m.pin===''){document.getElementById('login-err').textContent=t('noPin')||'Kein PIN hinterlegt';clearPins();return;}
  if(pin.length<4||String(m.pin).padStart(4,'0')!==pin){document.getElementById('login-err').textContent=t('wrongPin');clearPins();document.querySelectorAll('.pin')[0].focus();return;}
  document.getElementById('login').classList.add('hidden');
  var un=document.getElementById('topbar-user');if(un)un.textContent=m.fname;
  if(typeof afterLogin==='function')afterLogin(m);
}

function doLogout(){
  document.getElementById('login').classList.remove('hidden');
  clearPins();
  document.getElementById('login-err').textContent='';
  if(typeof afterLogout==='function')afterLogout();
}

async function loadDashboard(){
  try{
    var today=localDateStr(new Date());
    var res=await Promise.all([
      sbGet('orders','select=id,table_number,status,total_k,created_at,order_items(name)&status=in.(new,cooking,making,ready)&order=created_at.asc'),
      sbGet('sales','select=total_k&created_at=gte.'+localDayStart(today)+'&created_at=lte.'+localDayEnd(today))
    ]);
    var orders=res[0],sales=res[1];
    var revenue=sales.reduce(function(s,x){return s+(x.total_k||0);},0);
    var busyTables=new Set(orders.map(function(o){return o.table_number;})).size;
    document.getElementById('d-revenue').textContent='Rp '+revenue+'k';
    document.getElementById('d-orders').textContent=orders.length;
    document.getElementById('d-tables').textContent=busyTables+'/15';
    var tbody=document.getElementById('dash-orders');
    if(!orders.length){tbody.innerHTML='<tr><td colspan="5" style="text-align:center;padding:16px;color:var(--text3)">'+t('noActive')+'</td></tr>';return;}
    tbody.innerHTML=orders.map(function(o){
      var mins=Math.round((Date.now()-new Date(o.created_at).getTime())/60000);
      var items=(o.order_items||[]).map(function(i){return i.name;}).slice(0,3).join(', ')+(o.order_items&&o.order_items.length>3?'…':'');
      return '<tr><td><b>'+tw()+o.table_number+'</b></td>'+
        '<td><span class="badge '+o.status+'">'+o.status+'</span></td>'+
        '<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+items+'</td>'+
        '<td>Rp '+o.total_k+'k</td>'+
        '<td>'+mins+' min</td></tr>';
    }).join('');
  }catch(e){notify('⚠ '+e.message);}
}

var saleItemsCache={};

function localDateStr(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function localDayStart(dateStr){var p=dateStr.split('-');return new Date(+p[0],+p[1]-1,+p[2],0,0,0).toISOString();}
function localDayEnd(dateStr){var p=dateStr.split('-');return new Date(+p[0],+p[1]-1,+p[2],23,59,59,999).toISOString();}

async function loadReports(preset){
  var from=document.getElementById('rpt-from'),to=document.getElementById('rpt-to');
  var today=localDateStr(new Date());
  if(preset==='today'){from.value=today;to.value=today;}
  else if(preset==='week'){var d=new Date();d.setDate(d.getDate()-6);from.value=localDateStr(d);to.value=today;}
  var f=from.value||today,t2=to.value||today;
  try{
    var sales=await sbGet('sales','select=*&created_at=gte.'+localDayStart(f)+'&created_at=lte.'+localDayEnd(t2)+'&order=created_at.desc');
    var total=sales.reduce(function(s,x){return s+(x.total_k||0);},0);
    var cash=sales.filter(function(x){return x.payment_method==='cash';}).reduce(function(s,x){return s+(x.total_k||0);},0);
    document.getElementById('r-total').textContent='Rp '+total+'k';
    document.getElementById('r-count').textContent=sales.length;
    document.getElementById('r-cash').textContent='Rp '+cash+'k';
    document.getElementById('r-card').textContent='Rp '+(total-cash)+'k';
    document.getElementById('r-label').textContent=sales.length+' '+(lang==='de'?'Einträge':lang==='en'?'entries':'entri');
    var pm={cash:'💵 '+t('cash'),card:'💳 '+t('card'),qr:'📱 QRIS'};
    saleItemsCache={};
    document.getElementById('r-tbody').innerHTML=sales.length?sales.map(function(s){
      var dt=new Date(s.created_at).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      return '<tr class="sale-row" style="cursor:pointer" onclick="toggleSaleDetail('+s.id+','+(s.order_id||'null')+')">'+
        '<td>#'+s.id+' <span style="color:var(--text3);font-size:10px">▶</span></td><td>'+tw()+s.table_number+'</td><td>'+dt+'</td>'+
        '<td>'+(pm[s.payment_method]||s.payment_method||'—')+'</td>'+
        '<td><b>Rp '+s.total_k+'k</b></td>'+
        '<td><button class="storno-btn" onclick="event.stopPropagation();storno('+s.id+','+(s.order_id||'null')+')">✕</button></td></tr>'+
        '<tr id="sale-detail-'+s.id+'" style="display:none"><td colspan="6" style="background:var(--bg);padding:10px 16px;font-size:12px"></td></tr>';
    }).join(''):'<tr><td colspan="6" style="text-align:center;padding:16px;color:var(--text3)">'+lang==='de'?'Keine Einträge':'No entries'+'</td></tr>';
  }catch(e){notify('⚠ '+e.message);}
}

async function toggleSaleDetail(sid,oid){
  var row=document.getElementById('sale-detail-'+sid);
  if(!row)return;
  if(row.style.display==='table-row'){row.style.display='none';return;}
  var cell=row.querySelector('td');
  if(saleItemsCache[sid]){
    cell.innerHTML=saleItemsCache[sid];
  }else if(!oid||oid==='null'){
    cell.innerHTML='<span style="color:var(--text3)">'+(lang==='de'?'Keine Einzelposten verknüpft':lang==='en'?'No line items linked':'Tidak ada item terkait')+'</span>';
  }else{
    cell.innerHTML='<span style="color:var(--text3)">'+(lang==='de'?'Lade…':lang==='en'?'Loading…':'Memuat…')+'</span>';
    row.style.display='table-row';
    try{
      var items=await sbGet('order_items','select=name,quantity,price_k,category&order_id=eq.'+oid);
      var html=items.length?items.map(function(i){
        return '<div style="display:flex;justify-content:space-between;padding:2px 0"><span>'+i.quantity+'× '+i.name+'</span><span style="font-family:monospace">Rp '+(i.price_k*i.quantity)+'k</span></div>';
      }).join(''):'<span style="color:var(--text3)">'+(lang==='de'?'Keine Einzelposten':'No line items')+'</span>';
      saleItemsCache[sid]=html;
      cell.innerHTML=html;
    }catch(e){cell.innerHTML='<span style="color:var(--red)">⚠ '+e.message+'</span>';}
    return;
  }
  row.style.display='table-row';
}

var BARCATS=['Cocktails','Spanish Drinks','Drinks'];
var chartView='day',lastChartData=null;

async function loadChart(view){
  chartView=view||chartView;
  document.getElementById('chart-day-btn').classList.toggle('on',chartView==='day');
  document.getElementById('chart-month-btn').classList.toggle('on',chartView==='month');
  var now=new Date(),buckets=[];
  if(chartView==='day'){
    for(var i=13;i>=0;i--){
      var dayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i,0,0,0);
      var dayEnd=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i,23,59,59,999);
      buckets.push({from:dayStart.toISOString(),to:dayEnd.toISOString(),label:dayStart.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})});
    }
  }else{
    for(var i=11;i>=0;i--){
      var d=new Date(now.getFullYear(),now.getMonth()-i,1);
      var y=d.getFullYear(),m=d.getMonth();
      var from=new Date(y,m,1,0,0,0).toISOString();
      var to=new Date(y,m+1,0,23,59,59,999).toISOString();
      buckets.push({from:from,to:to,label:d.toLocaleDateString('de-DE',{month:'short',year:'2-digit'})});
    }
  }
  document.getElementById('chart-title').textContent=t('revenueChart')+' — '+(chartView==='day'?(lang==='de'?'letzte 14 Tage':lang==='en'?'last 14 days':'14 hari terakhir'):(lang==='de'?'letzte 12 Monate':lang==='en'?'last 12 months':'12 bulan terakhir'));
  try{
    var sales=await sbGet('sales','select=id,total_k,created_at,order_id&created_at=gte.'+buckets[0].from+'&created_at=lte.'+buckets[buckets.length-1].to);
    var oids=sales.map(function(s){return s.order_id;}).filter(function(x){return x!==null&&x!==undefined;});
    var itemsByOrder={};
    if(oids.length){
      var items=await sbGet('order_items','select=order_id,category,price_k,quantity&order_id=in.('+oids.join(',')+')');
      items.forEach(function(it){(itemsByOrder[it.order_id]=itemsByOrder[it.order_id]||[]).push(it);});
    }
    var data=buckets.map(function(b){return {label:b.label,bar:0,kitchen:0};});
    sales.forEach(function(s){
      var idx=-1;
      for(var i=0;i<buckets.length;i++){if(s.created_at>=buckets[i].from&&s.created_at<=buckets[i].to){idx=i;break;}}
      if(idx<0)return;
      var its=itemsByOrder[s.order_id];
      if(its&&its.length){
        its.forEach(function(it){
          var rev=(it.price_k||0)*(it.quantity||1);
          if(BARCATS.indexOf(it.category)>=0)data[idx].bar+=rev;else data[idx].kitchen+=rev;
        });
      }else{
        data[idx].kitchen+=(s.total_k||0);
      }
    });
    renderChart(data);
  }catch(e){notify('⚠ '+e.message);}
}

function renderChart(data){
  lastChartData=data;
  var w=Math.max(560,data.length*44),h=210,padL=38,padB=26,padT=8;
  var max=Math.max(1,Math.max.apply(null,data.map(function(d){return d.bar+d.kitchen;})));
  var bw=(w-padL-8)/data.length,barW=Math.min(26,bw*0.55);
  var svg='<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'">';
  for(var g=0;g<=4;g++){
    var y=padT+(h-padT-padB)*(1-g/4);
    svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
    svg+='<text x="'+(padL-6)+'" y="'+(y+3)+'" font-size="9" fill="var(--text3)" text-anchor="end">'+Math.round(max*g/4)+'</text>';
  }
  data.forEach(function(d,i){
    var x=padL+i*bw+(bw-barW)/2,yBase=h-padB;
    var kitH=(h-padT-padB)*(d.kitchen/max),barH=(h-padT-padB)*(d.bar/max);
    svg+='<rect x="'+x+'" y="'+(yBase-kitH)+'" width="'+barW+'" height="'+kitH+'" fill="var(--orange)" rx="2"/>';
    svg+='<rect x="'+x+'" y="'+(yBase-kitH-barH)+'" width="'+barW+'" height="'+barH+'" fill="var(--accent)" rx="2"/>';
    svg+='<text x="'+(x+barW/2)+'" y="'+(h-8)+'" font-size="9" fill="var(--text2)" text-anchor="middle">'+d.label+'</text>';
  });
  svg+='</svg>';
  document.getElementById('chart-svg-wrap').innerHTML=svg;
  document.getElementById('chart-legend').innerHTML=
    '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:16px;font-size:12px"><span style="width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block"></span>'+t('barRevenue')+'</span>'+
    '<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px"><span style="width:10px;height:10px;border-radius:2px;background:var(--orange);display:inline-block"></span>'+t('kitchenRevenue')+'</span>';
}

async function storno(sid,oid){
  if(!confirm(lang==='de'?'Wirklich stornieren?':'Really cancel?'))return;
  try{
    await sbDel('sales','id=eq.'+sid);
    if(oid&&oid!=='null')await sbPatch('orders','id=eq.'+oid,{status:'ready',payment_method:null});
    logAction('Zahlung storniert','Verkauf #'+sid+(oid&&oid!=='null'?' · Bestellung #'+oid:''));
    notify('✓ '+(lang==='de'?'Storniert':'Cancelled'));
    loadReports();
  }catch(e){notify('⚠ '+e.message);}
}

var editingStaffId=null;

async function loadStaff(){
  try{
    allStaff=await sbGet('staff','select=*&order=fname');
    document.getElementById('staff-tbody').innerHTML=allStaff.map(function(s){
      return '<tr><td>'+s.fname+' '+(s.lname||'')+'</td><td><code>'+s.pin+'</code></td>'+
        '<td>'+s.role+'</td>'+
        '<td style="white-space:nowrap"><button class="del-btn" style="border-color:var(--accent);background:var(--accent-bg);color:var(--accent);margin-right:4px" onclick="editStaff('+s.id+')">✏️</button>'+
        '<button class="del-btn" onclick="delStaff('+s.id+')">✕</button></td></tr>';
    }).join('')||'<tr><td colspan="4" style="text-align:center;padding:14px;color:var(--text3)">—</td></tr>';
  }catch(e){notify('⚠ '+e.message);}
}

function clearStaffForm(){
  document.getElementById('sf-fname').value='';
  document.getElementById('sf-lname').value='';
  document.getElementById('sf-pin').value='';
  document.getElementById('sf-role').value='service';
}

function toggleAddStaff(){
  var f=document.getElementById('add-staff-form');
  var willOpen=f.style.display==='none';
  f.style.display=willOpen?'block':'none';
  if(willOpen){editingStaffId=null;clearStaffForm();document.getElementById('save-staff-btn').textContent=t('save');}
}

function editStaff(id){
  var s=allStaff.find(function(x){return x.id===id;});
  if(!s)return;
  editingStaffId=id;
  document.getElementById('sf-fname').value=s.fname||'';
  document.getElementById('sf-lname').value=s.lname||'';
  document.getElementById('sf-pin').value=s.pin||'';
  document.getElementById('sf-role').value=s.role||'service';
  document.getElementById('add-staff-form').style.display='block';
  document.getElementById('save-staff-btn').textContent=t('save')+' ✓';
}

async function saveStaff(){
  var fname=document.getElementById('sf-fname').value.trim();
  var lname=document.getElementById('sf-lname').value.trim();
  var pin=document.getElementById('sf-pin').value.trim();
  var role=document.getElementById('sf-role').value;
  if(!fname||pin.length!==4){notify('⚠ '+t('firstName')+' + PIN erforderlich');return;}
  try{
    if(editingStaffId){
      await sbPatch('staff','id=eq.'+editingStaffId,{fname:fname,lname:lname,pin:pin,role:role});
      logAction('Mitarbeiter bearbeitet',fname+' '+lname+' · '+role);
    }else{
      await sbPost('staff',{fname:fname,lname:lname,pin:pin,role:role,active:true});
      logAction('Mitarbeiter angelegt',fname+' '+lname+' · '+role);
    }
    editingStaffId=null;
    clearStaffForm();
    document.getElementById('add-staff-form').style.display='none';
    notify('✓ '+t('save'));loadStaff();
  }catch(e){notify('⚠ '+e.message);}
}

async function delStaff(id){
  if(!confirm(lang==='de'?'Mitarbeiter löschen?':lang==='en'?'Delete staff?':'Hapus staf?'))return;
  var s=allStaff.find(function(x){return x.id===id;});
  try{
    await sbDel('staff','id=eq.'+id);
    logAction('Mitarbeiter gelöscht',s?(s.fname+' '+(s.lname||'')):'#'+id);
    loadStaff();notify('✓ '+t('delete'));
  }catch(e){notify('⚠ '+e.message);}
}

async function loadMenuAdmin(){
  try{
    var items=await sbGet('menu_items','select=*&order=sort_order,name');
    document.getElementById('menu-tbody').innerHTML=items.map(function(m){
      return '<tr><td>'+m.name+'</td><td>'+m.category+'</td><td>Rp '+m.price_k+'k</td>'+
        '<td><button class="avail-tog'+(m.available?' on':'')+'" onclick="toggleAvail('+m.id+','+m.available+')"></button></td></tr>';
    }).join('');
  }catch(e){notify('⚠ '+e.message);}
}

async function toggleAvail(id,cur){
  var m=(await sbGet('menu_items','select=name&id=eq.'+id).catch(function(){return [];}))[0];
  try{
    await sbPatch('menu_items','id=eq.'+id,{available:!cur});
    logAction('Verfügbarkeit geändert',(m?m.name:'#'+id)+' → '+(!cur?'verfügbar':'nicht verfügbar'));
    loadMenuAdmin();
  }catch(e){notify('⚠ '+e.message);}
}

async function loadAuditLog(preset){
  var from=document.getElementById('log-from'),to=document.getElementById('log-to');
  var today=localDateStr(new Date());
  if(preset==='today'&&!from.value){from.value=today;to.value=today;}
  var f=from.value||today,t2=to.value||today;
  var termFilter=document.getElementById('log-terminal-filter').value;
  try{
    var q='select=*&created_at=gte.'+localDayStart(f)+'&created_at=lte.'+localDayEnd(t2)+'&order=created_at.desc&limit=300';
    if(termFilter)q+='&terminal=eq.'+encodeURIComponent(termFilter);
    var rows=await sbGet('audit_log',q);
    document.getElementById('log-label').textContent=rows.length+' '+(lang==='de'?'Einträge':lang==='en'?'entries':'entri');
    document.getElementById('log-tbody').innerHTML=rows.length?rows.map(function(r){
      var dt=new Date(r.created_at).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      return '<tr><td style="white-space:nowrap">'+dt+'</td><td>'+(r.staff_name||'—')+(r.staff_role?' <span style="color:var(--text3);font-size:11px">('+r.staff_role+')</span>':'')+'</td>'+
        '<td>'+r.terminal+'</td><td>'+r.action+'</td><td style="color:var(--text2);font-size:12px">'+(r.details||'')+'</td></tr>';
    }).join(''):'<tr><td colspan="5" style="text-align:center;padding:16px;color:var(--text3)">'+(lang==='de'?'Keine Einträge':lang==='en'?'No entries':'Tidak ada entri')+'</td></tr>';
  }catch(e){notify('⚠ '+e.message);}
}

function afterLogin(m){currentStaff=m;setLabels();loadDashboard();timer=setInterval(loadDashboard,15000);}
function afterLogout(){if(timer)clearInterval(timer);}

window.addEventListener('DOMContentLoaded',function(){loadLoginStaff();initPins();setLabels();});
</script>
