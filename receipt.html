<!DOCTYPE html>
<!-- Mata Villas v2026-08-22 14:30 -->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quittung — Mata Villas</title>
<style>
:root{--accent:#3182ce;--text:#1a202c;--text2:#4a5568;--text3:#a0aec0;--border:#e2e8f0;--green:#276749;--green-bg:#f0fff4;
--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#f0f4f8;color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px}
.card{background:#fff;border-radius:14px;max-width:380px;width:100%;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.head{background:var(--accent);color:#fff;text-align:center;padding:20px 16px}
.head h1{font-size:17px;font-weight:800}
.head p{font-size:12px;opacity:.85;margin-top:3px}
.badge{background:var(--green-bg);color:var(--green);padding:8px 16px;font-size:12px;font-weight:600;text-align:center}
.row{display:flex;justify-content:space-between;padding:8px 16px;font-size:13px;border-bottom:1px solid var(--border)}
.row .n{flex:1}
.row .p{font-family:monospace;font-weight:600;color:var(--accent)}
.total{display:flex;justify-content:space-between;padding:16px;font-size:19px;font-weight:800;background:#f0f4f8}
.empty{padding:40px 20px;text-align:center;color:var(--text3)}
.foot{text-align:center;padding:16px;font-size:11px;color:var(--text3)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="empty" id="loading">Lädt…</div>
</div>
<script>
var SB='https://pxzdkyvndosikdmstnpp.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4emRreXZuZG9zaWtkbXN0bnBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NTIyNzQsImV4cCI6MjA5NTEyODI3NH0.QX1Iki-lguTfVsmyYWA9yPRtC8Qln-lMhSbCdMSdlYw';
async function sbGet(table,q){var r=await fetch(SB+'/rest/v1/'+table+'?'+(q||''),{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});if(!r.ok)throw new Error(r.status);return r.json();}

var pmLabel={cash:'💵 Bar',card:'💳 Karte',qr:'📱 QRIS'};
var catLabel={hotel:'🏨 Hotelzimmer',minibar:'🏠 Minibar',restaurant:'🍽️ Restaurant'};

function fmtDate(s){var d=new Date(s);return d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}

async function load(){
  var params=new URLSearchParams(window.location.search);
  var id=params.get('id');
  var card=document.getElementById('card');
  if(!id){card.innerHTML='<div class="empty">Keine Quittung angegeben.</div>';return;}
  try{
    var sales=await sbGet('sales','select=*,rooms(name)&id=eq.'+id+'&limit=1');
    if(!sales.length){card.innerHTML='<div class="empty">Quittung nicht gefunden.</div>';return;}
    var s=sales[0];
    var items=[];
    if(s.order_id){
      try{items=await sbGet('order_items','select=name,quantity,price_k&order_id=eq.'+s.order_id);}catch(e){}
    }
    var loc=s.revenue_category==='minibar'?(s.rooms?s.rooms.name:'Zimmer'):
             s.revenue_category==='hotel'?(s.rooms?s.rooms.name:'Zimmer'):
             ('Tisch '+s.table_number);
    var rows=items.map(function(i){
      return '<div class="row"><span class="n">'+i.quantity+'x '+i.name+'</span><span class="p">Rp '+(i.price_k*i.quantity)+'k</span></div>';
    }).join('');
    card.innerHTML=
      '<div class="head"><h1>Mata Tapas Bar</h1><p>Gili Trawangan · '+fmtDate(s.created_at)+'</p><p>'+(catLabel[s.revenue_category]||'')+' · '+loc+'</p></div>'+
      '<div class="badge">✓ Bezahlt · '+(pmLabel[s.payment_method]||s.payment_method||'—')+'</div>'+
      rows+
      '<div class="total"><span>Total</span><span>Rp '+s.total_k+'k</span></div>'+
      '<div class="foot">Vielen Dank für Ihren Besuch!</div>';
  }catch(e){
    card.innerHTML='<div class="empty">Fehler beim Laden.</div>';
  }
}
load();
</script>
</body>
</html>
